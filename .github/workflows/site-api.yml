# =====================================================================
#  API سیلانه‌سبز — تست + انتشار روی Cloudflare Workers + D1
#  Secrets لازم (در Settings → Secrets and variables → Actions):
#    CLOUDFLARE_API_TOKEN   توکن با دسترسی Workers Scripts:Edit و D1:Edit
#    CLOUDFLARE_ACCOUNT_ID  شناسه‌ی اکانت کلودفلر
#  Variables:
#    D1_DATABASE_ID         شناسه‌ی دیتابیس (خروجی دستور npm run db:create)
# =====================================================================
name: API — تست و انتشار

on:
  push:
    branches: [main]
    paths: ['site/worker/**', '.github/workflows/site-api.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: تست‌ها
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: نصب وابستگی‌ها
        working-directory: site/worker
        run: npm ci || npm install --no-audit --no-fund
      - name: typecheck + تست یکپارچگی
        working-directory: site/worker
        run: npm test

  deploy:
    name: انتشار روی کلودفلر
    needs: test
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: نصب وابستگی‌ها
        working-directory: site/worker
        run: npm ci || npm install --no-audit --no-fund

      - name: گذاشتن شناسه‌ی دیتابیس در wrangler.jsonc
        if: ${{ vars.D1_DATABASE_ID != '' }}
        working-directory: site/worker
        run: sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${{ vars.D1_DATABASE_ID }}/" wrangler.jsonc

      - name: ساخت جدول‌ها در D1
        working-directory: site/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote

      - name: وارد کردن کاتالوگ (برندها و محصولات)
        working-directory: site/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run seed:remote

      - name: انتشار Worker
        working-directory: site/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: بررسی سلامت API
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "⚠️ متغیر WORKER_URL تنظیم نشده؛ بررسی سلامت رد شد."
            exit 0
          fi
          sleep 5
          curl -fsS --retry 3 --retry-delay 5 "$WORKER_URL/api/health"
          echo ""
          echo "✅ API در دسترس است"
